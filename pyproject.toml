[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "momentum-daemon"
version = "0.1.0"
description = "MOMENTUM - Local AI Developer Workflow Discovery Daemon"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "typer[all]>=0.12",
    "psutil>=5.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "torch>=2.3",
    "faiss-cpu>=1.8",
    "langchain>=0.2",
    "langgraph>=0.1",
    "httpx>=0.27",
    "watchdog>=4.0",
    "python-dotenv>=1.0",
    "gitpython>=3.1",
    "tabulate>=0.9",
    "questionary>=2.0",
    "playwright>=1.44",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "anyio>=4.0",
]

[project.scripts]
momentum = "momentum.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["momentum*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.package-data]
"momentum" = ["**/*.json", "**/*.yaml"]
